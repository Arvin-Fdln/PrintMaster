<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>PrintMaster</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: transparent;
  }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    user-select: none; -webkit-app-region: drag;
  }
  .splash-wrap {
    display: flex; flex-direction: column;
    align-items: center;
    position: relative;
  }
  #lottie-container {
    width: 220px; height: 220px;
    display: flex; align-items: center; justify-content: center;
    /* pull it down so it overlaps the title */
    margin-bottom: -32px;
    position: relative; z-index: 2;
  }
  .app-name {
    font-size: 36px; font-weight: 800; color: #1a1a1a;
    letter-spacing: -1px;
    position: relative; z-index: 1;
    /* cat sits on top of this text */
  }
  .loading-dots {
    display: flex; gap: 7px; margin-top: 28px;
    position: relative; z-index: 2;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #1a1a1a; animation: pulse 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse {
    0%,80%,100% { opacity: 0.18; transform: scale(0.75); }
    40% { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
<div class="splash-wrap">
  <div id="lottie-container"></div>
  <div class="app-name">PrintMaster</div>
  <div class="loading-dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>

<script>
const container = document.getElementById('lottie-container');

function showFallback() {
  container.innerHTML = `
    <svg viewBox="0 0 120 120" width="140" height="140" xmlns="http://www.w3.org/2000/svg">
      <rect x="20" y="20" width="80" height="28" rx="8" fill="#1a1a1a"/>
      <rect x="20" y="55" width="80" height="45" rx="8" fill="#1a1a1a"/>
      <rect x="34" y="68" width="32" height="8" rx="4" fill="#f0ede8" opacity="0.6"/>
      <rect x="34" y="82" width="52" height="8" rx="4" fill="#f0ede8" opacity="0.6"/>
      <circle cx="82" cy="36" r="7" fill="#e74c3c"/>
    </svg>`;
}

const lottieScript = document.createElement('script');
lottieScript.src = '../assets/lottie.min.js';

lottieScript.onload = function() {
  fetch('../assets/splash.json')
    .then(r => { if (!r.ok) throw new Error('missing'); return r.json(); })
    .then(animData => {
      window.lottie.loadAnimation({
        container,
        renderer: 'svg',
        loop: true,
        autoplay: true,
        animationData: animData
      });
    })
    .catch(showFallback);
};

lottieScript.onerror = showFallback;
document.head.appendChild(lottieScript);
</script>
</body>
</html>
